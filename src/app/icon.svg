<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A tab icon has to survive being 16px wide, so this is the branch motif
       reduced to the one thing it means: the highest tip is the lit one.
       Ink ground rather than the site's cream, because cream disappears
       against a light browser tab. -->
  <rect width="32" height="32" rx="7" fill="#15140f"/>
  <g fill="none" stroke="#f2ede3" stroke-width="2.6" stroke-linecap="round">
    <path d="M16 28V12"/>
    <path d="M16 22 8.5 15"/>
    <path d="M16 17 23.5 8.5"/>
  </g>
  <circle cx="23.5" cy="8.5" r="3.4" fill="#e86a28"/>
</svg>
